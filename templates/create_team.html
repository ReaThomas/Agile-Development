{% extends "base.html" %}

{% block title %}Create New Team{% endblock %}

{% block sidebar %}
<div class="col-md-3 col-lg-2 sidebar">
    <div class="list-group">
        <a href="{{ url_for('dashboard') }}" class="list-group-item">
            <i class="fas fa-tachometer-alt me-2"></i>Dashboard
        </a>
        <a href="{{ url_for('create_team') }}" class="list-group-item active">
            <i class="fas fa-plus-circle me-2"></i>Create Team
        </a>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-users me-2"></i>Create New Team
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="team_name" class="form-label">Team Name</label>
                            <input type="text" class="form-control" id="team_name" name="team_name" required>
                            <div class="form-text">Choose a unique and descriptive name for your team.</div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Create Team
                            </button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
